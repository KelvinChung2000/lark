[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "lark-lalr-rs"
version = "0.1.0"
description = "Native lexer and LALR(1) driver for Lark, selected with Lark(parser='lalr-rs')"
license = {text = "MIT"}
requires-python = ">=3.11"

[tool.maturin]
module-name = "lark_lalr_rs"
