[package]
name = "lark-lalr-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native lexer and LALR(1) driver for Lark, selected with Lark(parser='lalr-rs')"
publish = false

[lib]
name = "lark_lalr_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
pcre2-sys = "0.2"
memchr = "2"
